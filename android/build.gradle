group 'com.flutterplayer.fplayer'
version '1.0'

def fplayerCoreMavenRepo = providers.gradleProperty('FPLAYER_CORE_MAVEN_REPO')
        .orElse(providers.environmentVariable('FPLAYER_CORE_MAVEN_REPO'))
        .getOrNull()

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

rootProject.allprojects {
    repositories {
        if (fplayerCoreMavenRepo != null && !fplayerCoreMavenRepo.isBlank()) {
            maven {
                url = uri(fplayerCoreMavenRepo)
            }
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    namespace 'com.flutterplayer.fplayer'


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
    }
}

dependencies {

    // implementation(name: 'fijkplayer-full-release', ext: 'aar')

    // fplayer-core includes the Java API and native libraries for armv7, arm64, x86, and x86_64.
    implementation 'io.github.sarmay:fplayer-core:1.1.0-sarmay.1'
    implementation 'androidx.annotation:annotation:1.2.0'
}
